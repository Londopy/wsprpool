name: Release

# A tag push builds the wheel and sdist and publishes the GitHub release. PyPI
# only runs once the repo variable PYPI_PUBLISH is "true", which is set after
# the trusted publisher exists on pypi.org; until then that job is skipped
# instead of failing. Run the workflow by hand with an existing tag to publish
# that version to PyPI later: the GitHub job sees the release and leaves it be.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build patchnotes==2.6.0
      # the tag, the changelog and pyproject.toml must all name the same version
      - env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          patchnotes CHANGELOG.md validate --strict
          patchnotes CHANGELOG.md check-version --against "$TAG"
          patchnotes CHANGELOG.md check-version --against pyproject.toml
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      # a draft left by a run that died part way would otherwise block every re-run
      - id: exists
        run: |
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = true ]; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already exists, leaving it as it is." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      # the workflow's own commit, so a fixed release script can rebuild an older tag;
      # full history so the notes can link the compare view against the previous tag
      - if: steps.exists.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: steps.exists.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - if: steps.exists.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.exists.outputs.skip != 'true'
        run: pip install segno==1.6.6
      # release candidates don't count as the previous release of a stable tag
      - if: steps.exists.outputs.skip != 'true'
        run: |
          case "$TAG" in
            *-*) prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true) ;;
            *) prev=$(git describe --tags --abbrev=0 --exclude '*-*' "$TAG^" 2>/dev/null || true) ;;
          esac
          python scripts/release_notes.py "$TAG" dist ${prev:+--prev "$prev"} --out body.md
      # gh uploads to a draft and publishes it at the end, deleting the draft if an upload fails
      - if: steps.exists.outputs.skip != 'true'
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease";; esac
          gh release create "$TAG" dist/* --verify-tag --title "$(cat title.txt)" \
            --notes-file body.md $flags
